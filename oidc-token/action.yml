name: Forgejo OIDC token
description: Request and mask a short-lived OIDC ID token from a Forgejo Actions job.

inputs:
  audience:
    description: Audience accepted by the target OIDC relying party.
    required: true

outputs:
  token:
    description: The requested short-lived OIDC ID token.
    value: ${{ steps.request.outputs.token }}

runs:
  using: composite
  steps:
    - id: request
      name: Request OIDC token
      shell: sh
      env:
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -eu
        token="$(
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" |
          jq -er '.value'
        )"
        echo "::add-mask::${token}"
        printf 'token=%s\n' "${token}" >> "${GITHUB_OUTPUT}"
